# CI pipeline for Chronicle
# Runs backend compilation check, frontend build, and lint on every push/PR to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Demo exporter tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Curated data cites a source for every event, link and perspective
        run: python scripts/validate_curated.py

      - name: Demo snapshot is up to date
        run: |
          python scripts/export_demo_snapshot.py --out /tmp/snapshot.json
          cmp /tmp/snapshot.json frontend/public/demo/snapshot.json || {
            echo "frontend/public/demo/snapshot.json is stale: run python3 scripts/export_demo_snapshot.py and commit it"; exit 1; }

      - name: Space view layout is up to date
        run: |
          python scripts/compute_space_layout.py --out /tmp/space-layout.json
          cmp /tmp/space-layout.json frontend/public/demo/space-layout.json || {
            echo "frontend/public/demo/space-layout.json is stale: run python3 scripts/compute_space_layout.py and commit it"; exit 1; }

      - name: Run tests or compile check
        run: |
          cd backend
          if python -m pytest --co -q 2>/dev/null; then
            python -m pytest
          else
            echo "No pytest tests found — running py_compile on all .py files"
            find . -name "*.py" -exec python -m py_compile {} +
          fi

      - name: Check seed data for duplicate events
        run: python backend/scripts/duplicate_events.py --check

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build (fails on TypeScript errors)
        run: npm run build
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend
