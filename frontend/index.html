<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicle — Immutable Historical Timeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f3f4f6;
        color: #111827;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #070e22;
        color: #f1f5f9;
      }
      /* Override react-flow defaults for dark theme */
      .react-flow__background {
        background-color: transparent !important;
      }
      .react-flow__renderer {
        background: transparent !important;
      }
      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }
      html.dark ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
      html.dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
      html.dark ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

      /* MapLibre GL attribution */
      .maplibregl-ctrl-attrib { display: none !important; }
      .maplibregl-canvas { border-radius: 0 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
