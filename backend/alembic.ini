# Alembic configuration file.
# Used to run migrations via: alembic upgrade head

[alembic]
# Path to migration scripts
script_location = alembic

# Use async-compatible URL — overridden in env.py from DATABASE_URL_SYNC env var
sqlalchemy.url = postgresql://chronicle:chronicle@localhost:5432/chronicle

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
